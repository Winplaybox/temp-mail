name: Maintenance (Python worker)

# Hourly: cleanup expired inboxes, usage stats, site health, and an end-to-end self-test
# (create inbox → webhook mail → code detected → delete). ~1 min per run ≈ 720 min/month.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # lets the keepalive step re-enable this workflow

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults: { run: { working-directory: worker-py } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: worker-py/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m tempmail_worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEMPMAIL_SERVER_SECRET: ${{ secrets.TEMPMAIL_SERVER_SECRET }}
          TEMPMAIL_INGEST_SECRET: ${{ secrets.TEMPMAIL_INGEST_SECRET }}
          TEMPMAIL_SITE_URL: https://temp-mail.winplaybox.in
      # GitHub pauses scheduled workflows after 60 days without repo activity.
      # Re-enabling through the API on every run keeps the hourly worker alive.
      - name: Keep schedule alive
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/cron.yml/enable" || true
